<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Fundamentos de Hipertrofia</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animaciones suaves para las transiciones */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden fade-in" id="app-container">
        <!-- Header -->
        <div class="bg-blue-600 text-white p-6 text-center">
            <h1 class="text-2xl md:text-3xl font-bold mb-2">Evaluación Fitness</h1>
            <p class="text-blue-100 text-sm md:text-base">Demuestra tus conocimientos sobre entrenamiento y nutrición.</p>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-gray-200 h-2">
            <div id="progress-bar" class="bg-blue-500 h-2 transition-all duration-300" style="width: 0%;"></div>
        </div>

        <!-- Quiz Content -->
        <div class="p-6 md:p-8">
            <div id="quiz-screen">
                <div class="flex justify-between text-sm text-gray-500 font-semibold mb-4">
                    <span id="question-counter">Pregunta 1 de 5</span>
                    <span id="score-display">Puntos: 0</span>
                </div>

                <h2 id="question-text" class="text-xl md:text-2xl font-semibold mb-6 text-slate-700">
                    ¿Pregunta?
                </h2>

                <div id="options-container" class="space-y-3 mb-6">
                    <!-- Las opciones se inyectan mediante JS -->
                </div>

                <!-- Feedback Section (Oculto por defecto) -->
                <div id="feedback-container" class="hidden rounded-lg p-4 mb-6 fade-in">
                    <p id="feedback-title" class="font-bold text-lg mb-1"></p>
                    <p id="feedback-text" class="text-sm"></p>
                </div>

                <button id="next-btn" class="hidden w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-md">
                    Siguiente Pregunta
                </button>
            </div>

            <!-- Result Screen (Oculto por defecto) -->
            <div id="result-screen" class="hidden text-center fade-in py-8">
                <div id="result-icon" class="text-6xl mb-4">🏆</div>
                <h2 class="text-3xl font-bold text-slate-800 mb-2">¡Completado!</h2>
                <p class="text-gray-600 mb-6">Has terminado la evaluación.</p>
                
                <div class="bg-slate-50 rounded-xl p-6 mb-8 border border-slate-200 shadow-sm">
                    <p class="text-lg text-slate-500 mb-1">Tu puntuación final es:</p>
                    <p id="final-score" class="text-5xl font-extrabold text-blue-600"></p>
                </div>

                <button id="restart-btn" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-lg transition-colors shadow-md w-full sm:w-auto">
                    Volver a intentarlo
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Base de Datos de Preguntas ---
        const questions = [
            {
                question: 'En un esquema de entrenamiento "Push-Pull-Legs", ¿qué grupos musculares se trabajan en un día "Push" (Empuje)?',
                options: [
                    'Espalda, bíceps y antebrazos',
                    'Pecho, hombros y tríceps',
                    'Cuádriceps, isquiosurales y gemelos',
                    'Abdomen y zona lumbar'
                ],
                correctAnswer: 1,
                explanation: 'Los movimientos de empuje involucran principalmente la musculatura anterior del tren superior: el pectoral (pecho), los deltoides (hombros) y los tríceps.'
            },
            {
                question: 'Para una persona ocupada que busca cambiar su composición corporal (de "gordiflaco" a musculoso), ¿cuál es el rango óptimo general de ingesta de proteína diaria?',
                options: [
                    '0.5 a 0.8 gramos por kg de peso',
                    '1.6 a 2.2 gramos por kg de peso',
                    'Más de 4.0 gramos por kg de peso',
                    'La proteína no importa si hay déficit calórico'
                ],
                correctAnswer: 1,
                explanation: 'Consumir entre 1.6g y 2.2g de proteína por kilo de peso corporal optimiza la síntesis proteica muscular, crucial para construir músculo mientras se pierde grasa.'
            },
            {
                question: '¿Qué es la "Sobrecarga Progresiva"?',
                options: [
                    'Entrenar hasta vomitar en cada sesión',
                    'Cambiar de rutina todos los días para "confundir" al músculo',
                    'Aumentar gradualmente el estímulo (peso, repeticiones o técnica) a lo largo del tiempo',
                    'Consumir cada vez más suplementos antes de entrenar'
                ],
                correctAnswer: 2,
                explanation: 'La sobrecarga progresiva es el principio fundamental de la hipertrofia. Significa hacer que el entrenamiento sea un poco más desafiante con el tiempo para forzar al cuerpo a adaptarse.'
            },
            {
                question: 'Si solo tienes 45-60 minutos para entrenar, ¿en qué tipo de ejercicios deberías enfocarte para maximizar resultados?',
                options: [
                    'Ejercicios de aislamiento en máquinas',
                    'Ejercicios compuestos (Sentadillas, Press de banca, Dominadas)',
                    'Únicamente trabajo abdominal',
                    'Trotar suavemente en la cinta'
                ],
                correctAnswer: 1,
                explanation: 'Los ejercicios compuestos involucran múltiples articulaciones y grandes grupos musculares a la vez, ofreciendo el mayor estímulo de hipertrofia en el menor tiempo.'
            },
            {
                question: '¿Por qué el descanso es un factor no negociable en un programa de 90 días?',
                options: [
                    'Porque el músculo crece mientras descansas y duermes, no en el gimnasio',
                    'Para evitar sudar demasiado',
                    'Porque acelera el metabolismo mágicamente',
                    'El descanso está sobrevalorado, hay que entrenar los 7 días'
                ],
                correctAnswer: 0,
                explanation: 'El entrenamiento rompe las fibras musculares (catabolismo). Es durante la recuperación y el sueño donde ocurre la síntesis proteica y el crecimiento real (anabolismo).'
            }
        ];

        // --- Variables de Estado ---
        let currentQuestionIndex = 0;
        let score = 0;
        let hasAnswered = false;

        // --- Elementos del DOM ---
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackText = document.getElementById('feedback-text');
        const questionCounter = document.getElementById('question-counter');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        // --- Funciones Principales ---

        function initQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            quizScreen.classList.remove('hidden');
            resultScreen.classList.add('hidden');
            updateUI();
        }

        function updateUI() {
            const currentQ = questions[currentQuestionIndex];
            hasAnswered = false;
            
            // Actualizar textos y progreso
            questionText.textContent = currentQ.question;
            questionCounter.textContent = `Pregunta ${currentQuestionIndex + 1} de ${questions.length}`;
            scoreDisplay.textContent = `Puntos: ${score}`;
            progressBar.style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;

            // Resetear UI
            optionsContainer.innerHTML = '';
            feedbackContainer.classList.add('hidden');
            nextBtn.classList.add('hidden');

            // Renderizar opciones
            currentQ.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-lg border-2 border-slate-200 bg-white hover:border-blue-400 hover:bg-blue-50 transition-all font-medium text-slate-700 focus:outline-none';
                btn.textContent = option;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, selectedBtn) {
            if (hasAnswered) return; // Prevenir múltiples clics
            hasAnswered = true;

            const currentQ = questions[currentQuestionIndex];
            const isCorrect = selectedIndex === currentQ.correctAnswer;
            const allButtons = optionsContainer.querySelectorAll('button');

            // Deshabilitar todos los botones y aplicar estilos
            allButtons.forEach((btn, index) => {
                btn.disabled = true;
                btn.classList.remove('hover:border-blue-400', 'hover:bg-blue-50', 'cursor-pointer');
                
                if (index === currentQ.correctAnswer) {
                    // Resaltar la respuesta correcta siempre
                    btn.classList.add('border-green-500', 'bg-green-50', 'text-green-800');
                } else if (index === selectedIndex && !isCorrect) {
                    // Resaltar el error del usuario
                    btn.classList.add('border-red-500', 'bg-red-50', 'text-red-800');
                } else {
                    // Opacar el resto
                    btn.classList.add('opacity-50');
                }
            });

            // Lógica de puntuación
            if (isCorrect) {
                score += 20; // 5 preguntas = 100 puntos máx
                scoreDisplay.textContent = `Puntos: ${score}`;
            }

            showFeedback(isCorrect, currentQ.explanation);
        }

        function showFeedback(isCorrect, explanation) {
            feedbackContainer.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            
            if (isCorrect) {
                feedbackContainer.classList.add('bg-green-100', 'text-green-800');
                feedbackTitle.textContent = '¡Correcto! ✅';
            } else {
                feedbackContainer.classList.add('bg-red-100', 'text-red-800');
                feedbackTitle.textContent = 'Incorrecto ❌';
            }
            
            feedbackText.textContent = explanation;
            nextBtn.classList.remove('hidden');
            
            // Auto-scroll suave en móviles
            nextBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function handleNext() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                updateUI();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            progressBar.style.width = '100%';
            
            finalScoreDisplay.textContent = `${score}/100`;
            
            const resultIcon = document.getElementById('result-icon');
            if (score === 100) {
                resultIcon.textContent = '🏅';
            } else if (score >= 60) {
                resultIcon.textContent = '💪';
            } else {
                resultIcon.textContent = '📚';
            }
        }

        // --- Event Listeners ---
        nextBtn.addEventListener('click', handleNext);
        restartBtn.addEventListener('click', initQuiz);

        // --- Iniciar App ---
        initQuiz();
    </script>
</body>
</html>
